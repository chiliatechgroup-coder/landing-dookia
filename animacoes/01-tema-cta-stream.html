<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dookia — Animação 01 · Tema → CTA → Stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#CCF766; --lilac:#F2C7F5; --ink:#1A191D; --muted:#625A69;
  --surface:#FFFBFF; --low:#F7F2F7; --line:#E9E2F0;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Figtree',system-ui,sans-serif;background:var(--low);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;color:var(--ink)}
.stage{width:min(560px,100%)}
/* Janela Mac */
.browser{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(26,25,29,.25);opacity:0;transform:translateY(18px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.browser.in{opacity:1;transform:none}
.chrome{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#FF5F57}.dot.y{background:#FEBC2E}.dot.g{background:#28C840}
.url{flex:1;margin-left:12px;background:var(--low);border-radius:999px;font-size:13px;color:var(--muted);padding:6px 16px;font-weight:500}
.body{padding:28px;min-height:420px;display:flex;flex-direction:column;gap:16px}
.q{font-size:15px;font-weight:700}
.input{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;font-size:16px;min-height:56px;background:#fff}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cta{position:relative;overflow:hidden;border:0;cursor:default;background:var(--ink);color:#fff;font-family:inherit;font-weight:600;font-size:16px;padding:15px;border-radius:999px;transition:background-color .2s ease;align-self:stretch}
.cta.hit{background:var(--dookia-lime,#CCF766)}
.touch{position:absolute;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none}
.touch.go{animation:tap .55s var(--ease-out) forwards}
@keyframes tap{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
/* Loading */
.loading{display:none;align-items:center;gap:12px;color:var(--muted);font-size:15px;font-weight:500}
.loading.on{display:flex}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--ink);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Resultado stream */
.result{display:none;flex-direction:column;gap:10px;background:var(--low);border:1px solid var(--line);border-radius:14px;padding:18px;max-height:230px;overflow:hidden}
.result.on{display:flex}
.result h4{font-size:16px}
.result p{font-size:14px;line-height:1.55;color:#3A3740;min-height:120px}
.stream-caret{display:inline-block;width:8px;height:1em;background:var(--ink);vertical-align:-1px;animation:blink 1s steps(1) infinite}
.fadeout{opacity:0 !important;transform:translateY(10px) !important}
.hint{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  .browser{opacity:1;transform:none;transition:none}
  .caret,.stream-caret,.spin,.touch{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="browser" id="browser">
    <div class="chrome"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="url">dookia.app/criar</span></div>
    <div class="body">
      <p class="q">Que trabalho vamos fazer hoje?</p>
      <div class="input"><span id="typed"></span><span class="caret" id="caret"></span></div>
      <button class="cta" id="cta">Criar trabalho<span class="touch" id="touch"></span></button>
      <div class="loading" id="loading"><span class="spin"></span>Gerando seu trabalho…</div>
      <div class="result" id="result">
        <h4>Revolução Industrial</h4>
        <p><span id="stream"></span><span class="stream-caret"></span></p>
      </div>
    </div>
  </div>
  <p class="hint">Animação 01 · loop de 8s · digitar → tocar → gerar → stream</p>
</div>
<script>
const THEME = "Revolução Industrial";
const STREAM = "A Revolução Industrial transformou o mundo entre os séculos XVIII e XIX. Novas máquinas aceleraram a produção, cidades cresceram e o trabalho mudou para sempre. Neste trabalho, exploramos as causas, as invenções e os impactos sociais dessa era — com estrutura pronta, referências e conclusão para defender em sala.";
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

async function typeInto(el, text, cps){
  el.textContent = "";
  for(const ch of text){ el.textContent += ch; await wait(1000/cps); }
}
async function streamInto(el, text, wps){
  el.textContent = "";
  for(const word of text.split(" ")){ el.textContent += word + " "; await wait(1000/wps); }
}
async function loop(){
  const browser=$('browser'), typed=$('typed'), caret=$('caret'),
        cta=$('cta'), touch=$('touch'), loading=$('loading'),
        result=$('result'), stream=$('stream');
  while(true){
    // reset
    browser.classList.remove('in','fadeout');
    typed.textContent=""; stream.textContent="";
    caret.style.display=""; loading.classList.remove('on');
    result.classList.remove('on'); cta.classList.remove('hit');
    await wait(400);
    browser.classList.add('in');
    await wait(700);
    // digita o tema ~11 cps
    await typeInto(typed, THEME, 11);
    caret.style.display="none";
    await wait(350);
    // toque mobile no CTA
    const r = cta.getBoundingClientRect(), b = browser.getBoundingClientRect();
    touch.style.left = (r.left - b.left + r.width/2) + 'px';
    touch.style.top = (r.top - b.top + r.height/2) + 'px';
    touch.classList.remove('go'); void touch.offsetWidth; touch.classList.add('go');
    cta.classList.add('hit');
    await wait(600);
    // loading
    loading.classList.add('on');
    await wait(1200);
    loading.classList.remove('on');
    // stream ~28 palavras/s
    result.classList.add('on');
    await streamInto(stream, STREAM, 26);
    await wait(1100);
    browser.classList.add('fadeout');
    await wait(500);
  }
}
if(reduce){
  $('browser').classList.add('in');
  $('typed').textContent = THEME;
  $('caret').style.display = "none";
  $('result').classList.add('on');
  $('stream').textContent = STREAM;
}else{
  loop();
}
</script>
</body>
</html>
