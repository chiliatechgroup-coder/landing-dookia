<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dookia — Animação 01.2 · Morph botão → card Max</title>
<link rel="stylesheet" href="shared.css">
<style>
.stage{position:relative;width:min(560px,100%);display:flex;justify-content:center}
.morph{position:relative;width:280px;height:62px;background:var(--ink);color:#fff;border:1px solid transparent;border-radius:999px;box-shadow:0 0 0 rgba(26,25,29,0);overflow:hidden}
.morph.live{transition:width .55s var(--ease-spring),height .55s var(--ease-spring),border-radius .55s var(--ease-spring),background-color .3s ease,border-color .3s ease,box-shadow .4s ease}
.morph.open{width:100%;height:600px;background:#fff;color:var(--ink);border-color:var(--line);border-radius:22px;box-shadow:0 40px 80px -40px rgba(26,25,29,.25)}
.pill-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;transition:opacity .15s ease}
.morph.open .pill-label{opacity:0;pointer-events:none}
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none}
.morph.open .sheet{opacity:1;pointer-events:auto;transition:opacity .3s ease .35s}
.maxbar{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.maxbar .max{background:var(--lime);border:1.5px solid var(--ink);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.06em}
.cbody{padding:22px;display:flex;flex-direction:column;gap:14px;flex:1}
.rise{opacity:0;transform:translateY(12px);transition:opacity .35s var(--ease-out),transform .35s var(--ease-spring)}
.rise.in{opacity:1;transform:none}
.q{font-size:15px;font-weight:700}
.input{border:1.5px solid var(--ink);border-radius:14px;padding:14px 16px;font-size:16px;min-height:56px;background:#fff}
.cta{position:relative;border:0;background:var(--ink);color:#fff;font-family:inherit;font-weight:600;font-size:16px;padding:15px;border-radius:999px;min-height:54px;display:flex;align-items:center;justify-content:center}
.cta .busy{display:none;align-items:center;gap:10px}
.cta.busy .label{display:none}
.cta.busy .busy{display:flex}
.spin.fast{animation-duration:.45s;border-top-color:#fff}
.paper{display:none;flex-direction:column;gap:12px;opacity:0;transition:opacity .25s var(--ease-out)}
.paper.on{display:flex;opacity:1}
.paper h4{font-size:19px;letter-spacing:-.01em}
.paper p{font-size:14px;line-height:1.6;color:#3A3740;margin-top:2px}
.paper ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.paper li{font-size:14px;line-height:1.5;color:#3A3740;padding-left:26px;position:relative;opacity:0;transform:translateY(8px);transition:opacity .3s var(--ease-out),transform .3s var(--ease-spring)}
.paper li.in{opacity:1;transform:none}
.paper li::before{content:"";position:absolute;left:0;top:.72em;width:15px;height:2px;border-radius:2px;background:var(--ink)}
.stream-caret{display:inline-block;width:8px;height:1em;background:var(--ink);vertical-align:-1px;animation:blink 1s steps(1) infinite}
.touch{position:absolute;width:44px;height:44px;border-radius:50%;border:2.5px solid #fff;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;z-index:5}
.touch.go{transition:transform .5s var(--ease-spring),opacity .5s var(--ease-out);transform:translate(-50%,-50%) scale(1.15);opacity:0}
.morph.snap,.morph.snap *{transition:none !important}
@media (prefers-reduced-motion:reduce){
  .morph,.rise,.paper,.paper li{transition:none}
  .stream-caret,.touch{animation:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="morph" id="morph">
    <span class="pill-label" id="pillLabel">+ Novo trabalho</span>
    <div class="sheet" id="sheet">
      <div class="maxbar">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M13 3c-2.5 0-4 1.8-4.6 3.4C6.8 6.6 5 8.2 5 10.6c0 1.9 1.3 3.3 2.9 3.7-.3 2.5 1.4 5.7 5.1 5.7s5.4-3.2 5.1-5.7c1.6-.4 2.9-1.8 2.9-3.7 0-2.4-1.8-4-3.4-4.2C17 4.8 15.5 3 13 3Z" stroke="#1A191D" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13 3v17M9 8.5c1 1 2.4 1.4 4 1.4s3-.4 4-1.4M9.5 14.5c1 .8 2.2 1.2 3.5 1.2s2.5-.4 3.5-1.2" stroke="#1A191D" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Dookia <span class="max">MAX</span>
      </div>
      <div class="cbody" id="cbody">
        <p class="q rise">Que trabalho vamos fazer hoje?</p>
        <div class="input rise"><span id="typed"></span><span class="caret" id="caret"></span></div>
        <button class="cta rise" id="cta"><span class="label">Criar trabalho</span><span class="busy"><span class="spin fast"></span>A gerar…</span></button>
        <div class="paper" id="paper">
          <h4><span id="ahead"></span></h4>
          <p><span id="abody"></span></p>
          <ul id="alist"></ul>
          <span class="stream-caret"></span>
        </div>
      </div>
    </div>
  </div>
  <p class="hint" style="position:absolute;bottom:-46px;width:100%">Animação 01.2 · loop de 8s · morph real → stream no card</p>
</div>
<script src="shared.js"></script>
<script>
const THEME = "Revolução Industrial";
const HEAD = "Revolução Industrial";
const BODY = "Entre os séculos XVIII e XIX, a mecanização transformou a produção e a sociedade europeia.";
const BULLETS = ["Máquina a vapor e tear mecânico","Crescimento das cidades industriais","Novas relações de trabalho"];
const $ = id => document.getElementById(id);

async function loop(){
  const morph=$('morph'), stage=$('stage'), rises=[...document.querySelectorAll('.rise')],
        typed=$('typed'), caret=$('caret'), cta=$('cta'),
        paper=$('paper'), ahead=$('ahead'), abody=$('abody'), alist=$('alist');
  while(true){
    // reset instantâneo
    morph.classList.add('snap');
    morph.classList.remove('open','live');
    rises.forEach(r=>r.classList.remove('in'));
    typed.textContent=""; ahead.textContent=""; abody.textContent=""; alist.innerHTML="";
    caret.style.display=""; cta.classList.remove('busy'); paper.classList.remove('on');
    void morph.offsetWidth;
    morph.classList.remove('snap');
    morph.classList.add('live');
    await wait(600);
    // toque no pill → estica de verdade até virar card
    await touchAt($('pillLabel'), morph);
    morph.classList.add('open');
    await wait(620);
    for(const r of rises){ r.classList.add('in'); await wait(90); }
    await wait(280);
    await typeInto(typed, THEME, 11);
    caret.style.display="none";
    await wait(350);
    // toque no CTA → busy dentro do botão
    await touchAt(cta, morph);
    cta.classList.add('busy');
    await wait(1100);
    // corpo (com CTA) sai junto → papel direto no card
    document.querySelectorAll('#cbody > .rise').forEach(r=>r.classList.remove('in'));
    await wait(240);
    paper.classList.add('on');
    await typeInto(ahead, HEAD, 30);
    await streamInto(abody, BODY, 30);
    for(const b of BULLETS){
      const li=document.createElement('li'); li.textContent=b;
      alist.appendChild(li); await wait(60); li.classList.add('in'); await wait(170);
    }
    await wait(850);
    morph.classList.remove('open');
    await wait(400);
  }
}
if(reduceMotion){
  const morph=$('morph'); morph.classList.add('open');
  morph.style.transition="none";
  document.querySelectorAll('.rise').forEach(r=>{ r.classList.add('in'); r.style.transition="none"; });
  $('typed').textContent=THEME; $('caret').style.display="none";
  document.querySelectorAll('#cbody > .rise').forEach(r=>r.classList.remove('in'));
  $('paper').classList.add('on');
  $('ahead').textContent=HEAD; $('abody').textContent=BODY;
  BULLETS.forEach(b=>{ const li=document.createElement('li'); li.textContent=b; li.classList.add('in'); li.style.transition="none"; $('alist').appendChild(li); });
}else{ loop(); }
</script>
</body>
</html>
